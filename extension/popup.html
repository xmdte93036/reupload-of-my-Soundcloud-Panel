<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Connection Status</title>
    <style>
        body {
            width: 280px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            margin: 0;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 600;
            color: #ff5500;
        }

        .footer {
            text-align: center;
            font-size: 10px;
            opacity: 0.6;
            margin-top: 12px;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            padding: 8px 10px;
            background: rgba(255, 85, 0, 0.08);
            border: 1px solid rgba(255, 85, 0, 0.18);
            border-radius: 10px;
        }

        .status-text {
            font-size: 12px;
            opacity: 0.9;
            font-weight: 600;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.45);
        }

        .status-indicator.connected .status-dot {
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.45);
        }
    </style>
</head>
<body>
    <div class="header">Connection Status</div>

    <div class="status-row">
        <div class="status-text">Status</div>
        <div class="status-indicator" id="statusIndicator">
            <span class="status-dot"></span>
            <span id="statusText">Not Connected</span>
        </div>
    </div>
    
    <div class="footer">
        SoundCloud Mini Player v3.0
    </div>

    <script src="popup.js"></script>
</body>
</html>
